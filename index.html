<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>South Australia — Family Trip Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f1e8;
  --surface:#fffdf8;
  --surface-2:#f0eade;
  --ink:#221d17;
  --ink-2:#4b4239;
  --dim:#8b7f70;
  --line:rgba(34,29,23,.13);
  --line-soft:rgba(34,29,23,.07);
  --terra:#b04a2b;
  --terra-soft:#f7e5dd;
  --sage:#5c7350;
  --sage-soft:#e6edde;
  --gold:#a1741c;
  --gold-soft:#f6ecd4;
  --water:#3a6b7c;
  --water-soft:#e0eaee;
  --shadow:0 1px 2px rgba(34,29,23,.05), 0 10px 28px -14px rgba(34,29,23,.22);
  --shadow-lg:0 2px 6px rgba(34,29,23,.06), 0 24px 60px -28px rgba(34,29,23,.35);
  --serif:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --sans:'DM Sans', 'Segoe UI', system-ui, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141210;
    --surface:#1e1b16;
    --surface-2:#272219;
    --ink:#f4ede1;
    --ink-2:#d0c6b7;
    --dim:#968a79;
    --line:rgba(244,237,225,.14);
    --line-soft:rgba(244,237,225,.07);
    --terra:#e28f6c;
    --terra-soft:#3b2620;
    --sage:#a8bd97;
    --sage-soft:#232b20;
    --gold:#d9b264;
    --gold-soft:#332b1b;
    --water:#8fbfd0;
    --water-soft:#1c2a2f;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 10px 28px -14px rgba(0,0,0,.7);
    --shadow-lg:0 2px 6px rgba(0,0,0,.4), 0 24px 60px -28px rgba(0,0,0,.9);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(900px 500px at 12% -8%, rgba(176,74,43,.09), transparent 70%),
    radial-gradient(800px 460px at 96% 4%, rgba(92,115,80,.10), transparent 70%),
    var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-weight:400}
p{margin:0}
a{color:var(--terra);text-decoration:none;border-bottom:1px solid color-mix(in srgb, var(--terra) 35%, transparent)}
a:hover{border-bottom-color:var(--terra)}
::selection{background:var(--gold-soft);color:var(--ink)}

/* ---------- shell ---------- */
.app{
  display:grid;
  grid-template-columns:252px minmax(0,1fr) 332px;
  gap:0;
  max-width:1680px;
  margin:0 auto;
  min-height:100vh;
  align-items:start;
}

/* ---------- sidebar ---------- */
.sidebar{
  position:sticky; top:0;
  height:100vh;
  padding:26px 18px 18px 26px;
  display:flex; flex-direction:column; gap:20px;
  border-right:1px solid var(--line-soft);
  overflow-y:auto;
  scrollbar-width:thin;
}
.brand__kicker{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
  color:var(--dim); display:flex; align-items:center; gap:7px;
}
.dot{width:6px;height:6px;border-radius:50%;background:var(--terra);display:inline-block;flex:0 0 auto}
.brand__title{font-family:var(--serif); font-size:27px; line-height:1.08; margin-top:9px; letter-spacing:-.01em}
.brand__title em{font-style:italic;color:var(--terra)}
.brand__meta{font-family:var(--mono); font-size:11px; color:var(--dim); margin-top:8px; letter-spacing:.03em}
.countdown{
  margin-top:14px; display:flex; align-items:baseline; gap:7px;
  padding:11px 13px; border-radius:12px;
  background:linear-gradient(180deg, var(--terra-soft), color-mix(in srgb,var(--terra-soft) 55%, transparent));
  border:1px solid color-mix(in srgb, var(--terra) 22%, transparent);
}
.countdown b{font-family:var(--serif); font-size:26px; line-height:1; color:var(--terra)}
.countdown span{font-size:11.5px; color:var(--ink-2); letter-spacing:.02em}

.nav__label{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--dim); margin-bottom:8px; padding-left:9px;
}
.nav{display:flex; flex-direction:column; gap:2px}
.nav__item{
  display:flex; align-items:center; gap:10px;
  padding:8px 9px; border-radius:10px;
  text-align:left; width:100%;
  border:1px solid transparent;
  transition:background .16s ease, border-color .16s ease;
  min-width:0;
}
.nav__item:hover{background:var(--surface-2)}
.nav__num{
  font-family:var(--mono); font-size:10.5px; color:var(--dim);
  width:19px; flex:0 0 19px; text-align:center; letter-spacing:0;
}
.nav__body{display:block; min-width:0; flex:1; overflow:hidden}
.nav__day{display:block; font-size:12px; color:var(--dim); font-family:var(--mono); letter-spacing:.02em; text-transform:uppercase}
.nav__title{
  display:block; font-size:13px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  line-height:1.35;
}
.nav__item.is-active{background:var(--surface); border-color:var(--line); box-shadow:var(--shadow)}
.nav__item.is-active .nav__title{color:var(--ink); font-weight:500}
.nav__item.is-active .nav__num{color:var(--terra); font-weight:500}
.nav__item.is-today .nav__day::after{
  content:''; display:inline-block; width:5px; height:5px; border-radius:50%;
  background:var(--sage); margin-left:6px; vertical-align:middle;
}
.side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line-soft); display:flex; flex-direction:column; gap:7px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 14px; border-radius:10px;
  border:1px solid var(--line);
  background:var(--surface);
  font-size:12.5px; font-weight:500; color:var(--ink-2);
  transition:transform .14s ease, background .16s ease, border-color .16s ease, color .16s ease;
  white-space:nowrap;
}
.btn:hover{background:var(--surface-2); color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn--primary{
  background:var(--ink); color:var(--surface); border-color:var(--ink);
}
.btn--primary:hover{background:var(--terra); border-color:var(--terra); color:#fff}
.btn--ghost{background:transparent; border-color:transparent; color:var(--dim)}
.btn--ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn--sm{padding:6px 10px; font-size:11.5px; border-radius:8px}
.btn--block{width:100%}

/* ---------- main ---------- */
.main{padding:34px 40px 90px; min-width:0}
.topbar{
  display:flex; align-items:flex-end; justify-content:space-between; gap:20px;
  flex-wrap:wrap; margin-bottom:26px;
}
.eyebrow{
  font-family:var(--mono); font-size:10px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim);
  display:flex; align-items:center; gap:8px;
}
.day-title{
  font-family:var(--serif); font-size:clamp(34px, 4.6vw, 52px); line-height:1.02;
  letter-spacing:-.015em; margin-top:10px;
}
.day-sub{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px}
.chip{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase;
  padding:4px 9px; border-radius:999px; border:1px solid var(--line);
  color:var(--ink-2); background:var(--surface);
  display:inline-flex; align-items:center; gap:5px;
}
.chip--stay{background:var(--sage-soft); border-color:color-mix(in srgb,var(--sage) 25%, transparent); color:var(--sage)}
.chip--region{background:var(--surface-2); border-color:transparent}
.chip--day{background:var(--terra-soft); border-color:color-mix(in srgb,var(--terra) 22%, transparent); color:var(--terra)}

.callout{
  display:flex; gap:11px; align-items:flex-start;
  padding:12px 15px; border-radius:12px; margin-top:18px;
  background:var(--gold-soft);
  border:1px solid color-mix(in srgb,var(--gold) 26%, transparent);
  font-size:13px; color:var(--ink-2); line-height:1.5;
}
.callout__mark{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold); flex:0 0 auto; padding-top:2px}

/* ---------- timeline ---------- */
.tl{margin-top:30px; position:relative}
.tl-row{display:grid; grid-template-columns:78px 22px minmax(0,1fr); gap:0; align-items:stretch}
.tl-time{
  font-family:var(--mono); font-size:12px; color:var(--ink-2);
  padding-top:15px; text-align:right; padding-right:14px; letter-spacing:-.01em; white-space:nowrap;
}
.tl-time i{font-style:normal; font-size:9.5px; color:var(--dim); text-transform:uppercase; margin-left:2px}
.tl-rail{position:relative; display:flex; justify-content:center}
.tl-rail::before{
  content:''; position:absolute; top:0; bottom:0; left:50%; width:1px;
  background:var(--line); transform:translateX(-.5px);
}
.tl-row:first-child .tl-rail::before{top:20px}
.tl-row:last-child .tl-rail::before{bottom:calc(100% - 20px)}
.tl-dot{
  position:relative; z-index:1; width:9px; height:9px; border-radius:50%;
  background:var(--surface); border:1.5px solid color-mix(in srgb,var(--ink) 30%, transparent);
  margin-top:19px; transition:background .18s ease, border-color .18s ease, transform .18s ease;
}
.tl-card{
  margin:0 0 10px 14px; padding:13px 16px 14px;
  background:var(--surface); border:1px solid var(--line-soft);
  border-radius:var(--r); box-shadow:0 1px 1px rgba(34,29,23,.03);
  transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
  min-width:0;
}
.tl-row:hover .tl-card{border-color:var(--line); box-shadow:var(--shadow)}
.tl-row:hover .tl-dot{border-color:var(--terra); background:var(--terra-soft)}
.tl-card__head{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.tl-card__title{font-size:15px; font-weight:500; letter-spacing:-.005em; color:var(--ink); min-width:0; overflow-wrap:break-word}
.tl-card__note{font-size:13px; color:var(--ink-2); margin-top:4px; line-height:1.5; overflow-wrap:break-word}
.tl-card__note a{font-size:12.5px}
.tag{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
  padding:2.5px 7px; border-radius:5px; flex:0 0 auto;
}
.t-food{background:var(--terra-soft); color:var(--terra)}
.t-tour{background:var(--gold-soft); color:var(--gold)}
.t-drive{background:var(--surface-2); color:var(--dim)}
.t-outdoors{background:var(--sage-soft); color:var(--sage)}
.t-stay{background:var(--water-soft); color:var(--water)}
.t-ferry{background:var(--water-soft); color:var(--water)}
.t-park{background:var(--sage-soft); color:var(--sage)}
.t-rest{background:var(--surface-2); color:var(--dim)}
.tl-actions{display:flex; gap:2px; margin-left:auto; opacity:0; transition:opacity .16s ease}
.tl-row:hover .tl-actions,.tl-actions:focus-within{opacity:1}
.icon-btn{
  width:26px; height:26px; border-radius:7px; display:inline-flex; align-items:center; justify-content:center;
  color:var(--dim); transition:background .15s ease, color .15s ease;
}
.icon-btn:hover{background:var(--surface-2); color:var(--ink)}
.icon-btn:hover.is-danger{color:var(--terra)}
.icon-btn svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round}
.tl-row.is-done .tl-card{opacity:.5}
.tl-row.is-done .tl-card__title{text-decoration:line-through; text-decoration-thickness:1px}
.tl-row.is-done .tl-dot{background:var(--sage); border-color:var(--sage)}
.done-btn svg{opacity:0}
.tl-row.is-done .done-btn svg{opacity:1}
.done-btn{color:var(--sage)}
.done-btn:hover{background:var(--sage-soft)}

.add-row{margin:16px 0 0 114px}

.maps-line{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin:26px 0 0 114px; padding-top:18px; border-top:1px dashed var(--line);
  font-size:12px; color:var(--dim);
}
.maps-line a{border-bottom-color:transparent; font-weight:500}
.maps-line a:hover{border-bottom-color:var(--terra)}

/* ---------- rail ---------- */
.rail{
  position:sticky; top:0; height:100vh; overflow-y:auto;
  padding:34px 26px 40px 6px; display:flex; flex-direction:column; gap:18px;
  scrollbar-width:thin;
}
.panel{background:var(--surface); border:1px solid var(--line-soft); border-radius:16px; padding:16px 16px 14px; box-shadow:var(--shadow)}
.panel--flat{box-shadow:none; background:transparent; border-color:transparent; padding:0}
.panel__head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
.panel__title{
  font-family:var(--mono); font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--dim);
  display:flex; align-items:center; gap:7px;
}
.panel__title .dot{background:var(--gold)}
.count-pill{
  font-family:var(--mono); font-size:10px; color:var(--dim);
  background:var(--surface-2); border-radius:999px; padding:1px 7px;
}
.next{
  padding:14px 15px; border-radius:14px; margin-bottom:14px;
  background:linear-gradient(160deg, color-mix(in srgb,var(--terra-soft) 85%, transparent), transparent);
  border:1px solid color-mix(in srgb,var(--terra) 20%, transparent);
}
.next__label{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--terra)}
.next__title{font-family:var(--serif); font-size:20px; line-height:1.15; margin-top:6px}
.next__when{font-size:12px; color:var(--ink-2); margin-top:5px}
.next__when b{font-family:var(--mono); font-size:11.5px; font-weight:500; color:var(--ink)}

.rem{display:flex; gap:10px; padding:9px 0; border-top:1px solid var(--line-soft); align-items:flex-start}
.rem:first-of-type{border-top:0}
.rem__check{
  width:17px;height:17px;flex:0 0 17px;margin-top:2px;border-radius:5px;
  border:1.5px solid color-mix(in srgb,var(--ink) 24%, transparent);
  display:flex;align-items:center;justify-content:center;
  transition:background .15s ease, border-color .15s ease;
}
.rem__check svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.rem.is-booked .rem__check{background:var(--sage);border-color:var(--sage)}
.rem.is-booked .rem__check svg{opacity:1}
.rem__body{min-width:0;flex:1}
.rem__title{font-size:13px; line-height:1.35; color:var(--ink); overflow-wrap:break-word}
.rem.is-booked .rem__title{color:var(--dim)}
.rem__meta{font-family:var(--mono); font-size:10.5px; color:var(--dim); margin-top:3px; letter-spacing:.01em; display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.rem__meta .sep{opacity:.45}
.rem__del{opacity:0}
.rem:hover .rem__del{opacity:1}
.rem__del .icon-btn{width:22px;height:22px}

.stay{display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line-soft)}
.stay:first-of-type{border-top:0;padding-top:0}
.stay__nights{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--water); background:var(--water-soft); border-radius:6px; padding:4px 6px; flex:0 0 auto; text-align:center;
}
.stay__name{font-size:13px; font-weight:500}
.stay__meta{font-size:11.5px; color:var(--dim); margin-top:2px}

/* ---------- overview ---------- */
.stats{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-top:26px}
.stat{
  padding:16px 16px 14px; border-radius:14px; background:var(--surface);
  border:1px solid var(--line-soft); box-shadow:var(--shadow);
}
.stat__n{font-family:var(--serif); font-size:32px; line-height:1; letter-spacing:-.02em}
.stat__l{font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin-top:7px}
.stat--accent .stat__n{color:var(--terra)}

.section-label{
  font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim);
  display:flex; align-items:center; gap:8px; margin:36px 0 14px;
}
.section-label::after{content:''; flex:1; height:1px; background:var(--line-soft)}

.day-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(238px,1fr)); gap:12px}
.day-card{
  text-align:left; padding:16px; border-radius:14px; background:var(--surface);
  border:1px solid var(--line-soft); box-shadow:var(--shadow);
  transition:transform .16s ease, border-color .16s ease, box-shadow .16s ease;
  display:flex; flex-direction:column; gap:6px; min-width:0;
}
.day-card:hover{transform:translateY(-2px); border-color:color-mix(in srgb,var(--terra) 30%, transparent); box-shadow:var(--shadow-lg)}
.day-card__d{font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--terra)}
.day-card__t{font-family:var(--serif); font-size:19px; line-height:1.15; letter-spacing:-.01em}
.day-card__meta{font-size:11.5px; color:var(--dim); font-family:var(--mono); letter-spacing:.01em}
.day-card__items{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px}
.mini-tag{font-size:10px; font-family:var(--mono); color:var(--dim); background:var(--surface-2); border-radius:4px; padding:1.5px 5px}

.tbl-wrap{overflow-x:auto; border:1px solid var(--line-soft); border-radius:14px; background:var(--surface); box-shadow:var(--shadow)}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:560px}
thead th{
  text-align:left; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--dim); font-weight:400; padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  position:sticky; top:0; background:var(--surface); z-index:1;
}
tbody td{padding:10px 14px; border-bottom:1px solid var(--line-soft); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--surface-2) 60%, transparent)}
td.when{font-family:var(--mono); font-size:11.5px; color:var(--ink-2); white-space:nowrap}
td.num{text-align:right; font-variant-numeric:tabular-nums}
.status{
  display:inline-flex; align-items:center; gap:6px; font-size:11.5px;
  padding:3px 9px; border-radius:999px; border:1px solid var(--line);
  color:var(--dim); white-space:nowrap; transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.status .pdot{width:6px;height:6px;border-radius:50%;background:var(--gold)}
.status.is-booked{color:var(--sage); border-color:color-mix(in srgb,var(--sage) 30%, transparent); background:var(--sage-soft)}
.status.is-booked .pdot{background:var(--sage)}
.status:hover{border-color:var(--ink)}

/* ---------- modal ---------- */
.backdrop{
  position:fixed; inset:0; background:rgba(24,20,16,.42); backdrop-filter:blur(3px);
  display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
}
.backdrop.is-open{display:flex; animation:fade .16s ease}
.modal{
  width:100%; max-width:440px; max-height:90vh; overflow-y:auto;
  background:var(--surface); border-radius:18px; border:1px solid var(--line);
  box-shadow:var(--shadow-lg); padding:22px 22px 18px;
  animation:rise .2s cubic-bezier(.2,.7,.3,1);
}
.modal__title{font-family:var(--serif); font-size:24px; letter-spacing:-.01em}
.modal__sub{font-size:12.5px; color:var(--dim); margin-top:3px}
.field{margin-top:14px}
.field label{
  display:block; font-family:var(--mono); font-size:9.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--dim); margin-bottom:5px;
}
.field input[type=text],.field input[type=time],.field input[type=tel],.field select,.field textarea{
  width:100%; padding:9px 11px; border-radius:9px;
  border:1px solid var(--line); background:var(--paper); color:var(--ink);
  outline:none; transition:border-color .15s ease, box-shadow .15s ease;
}
.field textarea{resize:vertical; min-height:64px; line-height:1.45}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--terra); box-shadow:0 0 0 3px color-mix(in srgb,var(--terra) 14%, transparent);
}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.modal__foot{display:flex; gap:8px; margin-top:20px; align-items:center}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x' + Math.random().toString(36).slice(2,9);
const toMin = t => { if(!t) return 9999; const [h,m] = t.split(':').map(Number); return h*60 + (m||0); };
function fmtTime(t){
  if(!t) return '—';
  const [h,m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return hh + ':' + String(m||0).padStart(2,'0') + ' ' + ap;
}
function fmtTimeParts(t){
  if(!t) return {main:'—', ap:''};
  const [h,m] = t.split(':').map(Number);
  const ap = h >= 12 ? 'pm' : 'am';
  const hh = h % 12 === 0 ? 12 : h % 12;
  return {main: hh + ':' + String(m||0).padStart(2,'0'), ap};
}
const dayById = id => state.days.find(d => d.id === id);
function dayLabel(d){ return d.dow + ' ' + d.daynum; }
function dateObj(d){ return new Date(d.date + 'T00:00:00'); }
function leadText(min){
  if(min >= 1440) return (min/1440) + (min/1440 === 1 ? ' day before' : ' days before');
  if(min >= 60)   return (min/60) + (min/60 === 1 ? ' hour before' : ' hours before');
  return min + ' min before';
}
function daysUntil(iso){
  const now = new Date(); now.setHours(0,0,0,0);
  const target = new Date(iso + 'T00:00:00');
  return Math.round((target - now) / 86400000);
}
function relDay(iso){
  const n = daysUntil(iso);
  if(n === 0) return 'today';
  if(n === 1) return 'tomorrow';
  if(n > 1)  return 'in ' + n + ' days';
  if(n === -1) return 'yesterday';
  return Math.abs(n) + ' days ago';
}
function todayISO(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function tripDayForToday(){
  const iso = todayISO();
  return state.days.find(d => d.date === iso);
}

   ========================================================= */
function renderSidebar(){
  const t = tripDayForToday();
  const nav = document.getElementById('dayNav');
  let html = `<button class="nav__item ${activeView === 'overview' ? 'is-active' : ''}" data-act="goto" data-view="overview">
      <span class="nav__num">—</span>
      <span class="nav__body"><span class="nav__day">Overview</span><span class="nav__title">All days & bookings</span></span>
      <span class="nav__m"><b>Trip</b><i>Overview</i></span>
    </button>`;
  state.days.forEach((d, i) => {
    const isToday = d.date === todayISO();
    html += `<button class="nav__item ${activeView === d.id ? 'is-active' : ''} ${isToday ? 'is-today' : ''}" data-act="goto" data-view="${d.id}">
      <span class="nav__num">${String(i+1).padStart(2,'0')}</span>
      <span class="nav__body"><span class="nav__day">${esc(dayLabel(d))}</span><span class="nav__title">${esc(d.title)}</span></span>
      <span class="nav__m"><b>Day ${i+1}</b><i>${esc(d.dow)} ${esc(d.daynum)}</i></span>
    </button>`;
  });
  nav.innerHTML = html;

  const n = daysUntil(TRIP_START);
  const cd = document.getElementById('countdown');
  if(n > 0){
    cd.innerHTML = `<b>${n}</b><span>${n === 1 ? 'day to go' : 'days until Adelaide'}</span>`;
  } else if(n === 0){
    cd.innerHTML = `<b>Today</b><span>— the trip starts</span>`;
  } else if(daysUntil(TRIP_END) >= 0){
    cd.innerHTML = `<b>On the road</b><span>Day ${Math.abs(n)+1} of 7</span>`;
  } else {
    cd.innerHTML = `<b>${Math.abs(daysUntil(TRIP_END))}</b><span>days since you got home</span>`;
  }

  const totalStops = state.days.reduce((a,d) => a + d.items.length, 0);
  document.getElementById('brandMeta').textContent = `Sat 2 – Fri 8 Jan 2027 · ${totalStops} stops`;
}

/* =========================================================
   MODALS
   ========================================================= */
const backdrop = document.getElementById('backdrop');
const modal = document.getElementById('modal');
let modalSubmit = null;

function closeModal(){
  backdrop.classList.remove('is-open');
  modalSubmit = null;
}
backdrop.addEventListener('mousedown', e => { if(e.target === backdrop) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

function openItemModal(dayId, idx){
  const d = dayById(dayId) || state.days[0];
  const item = idx != null ? d.items[idx] : null;
  modalSubmit = (data) => {
    if(!data.title) return 'Give the stop a name.';
    const target = dayById(data.day);
    if(item){
      item.t = data.t; item.title = data.title; item.note = data.note; item.tag = data.tag;
      if(data.day !== d.id){
        d.items.splice(idx, 1);
        target.items.push(item);
      }
    } else {
      target.items.push({t:data.t, title:data.title, note:data.note, tag:data.tag, done:false});
    }
    activeView = data.day;
    return null;
  };
  modal.innerHTML = `
    <div class="modal__title">${item ? 'Edit stop' : 'Add a stop'}</div>
    <div class="modal__sub">${item ? 'Change the time, name or note.' : 'Anything you want on the plan — a drive, a meal, a stop.'}</div>
    <form id="mform">
      <div class="field-row">
        <div class="field"><label>Time</label><input type="time" name="t" value="${esc(item ? item.t : '12:00')}" required></div>
        <div class="field"><label>Day</label>
          <select name="day">${state.days.map(x => `<option value="${x.id}" ${x.id === d.id ? 'selected' : ''}>${esc(dayLabel(x))}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field"><label>What</label><input type="text" name="title" value="${esc(item ? item.title : '')}" placeholder="e.g. Coffee at Hahndorf" required></div>
      <div class="field"><label>Note</label><textarea name="note" placeholder="Anything worth remembering">${esc(item ? item.note : '')}</textarea></div>
      <div class="field"><label>Tag</label>
        <select name="tag">${TAGS.map(t => `<option value="${t}" ${item && item.tag === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
      </div>
      <div class="modal__err" id="merr"></div>
      <div class="modal__foot">
        ${item ? `<button type="button" class="btn btn--sm btn--ghost" style="color:var(--terra)" data-act="del-item" data-day="${d.id}" data-idx="${idx}">Delete</button>` : ''}
        <span class="spacer"></span>
        <button type="button" class="btn btn--sm btn--ghost" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn btn--sm btn--primary">${item ? 'Save' : 'Add stop'}</button>
      </div>
    </form>`;
  backdrop.classList.add('is-open');
  bindForm();
  setTimeout(() => modal.querySelector('input[name=title]')?.focus(), 60);
}

function openBookingModal(opts){
  opts = opts || {};
  const b = opts.bookingId ? state.bookings.find(x => x.id === opts.bookingId) : null;
  const d = (b && dayById(b.day)) || dayById(opts.day) || state.days[0];
  const cur = b || {day:d.id, time:'09:00', title:'', type:'tour', lead:1440, status:'todo', phone:'', note:''};
  modalSubmit = (data) => {
    if(!data.title) return 'Give the booking a name.';
    if(b){
      Object.assign(b, data);
    } else {
      state.bookings.push({id:uid(), ...data});
    }
    return null;
  };
  modal.innerHTML = `
    <div class="modal__title">${b ? 'Edit booking' : 'Add a booking'}</div>
    <div class="modal__sub">Reminders are worked out from the booking time and how much notice you want.</div>
    <form id="mform">
      <div class="field"><label>What</label><input type="text" name="title" value="${esc(cur.title)}" placeholder="e.g. SeaLink ferry — car" required></div>
      <div class="field-row">
        <div class="field"><label>Day</label>
          <select name="day">${state.days.map(x => `<option value="${x.id}" ${x.id === cur.day ? 'selected' : ''}>${esc(dayLabel(x))}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Time</label><input type="time" name="time" value="${esc(cur.time)}" required></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Type</label>
          <select name="type">${BOOKING_TYPES.map(t => `<option value="${t}" ${cur.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Remind me</label>
          <select name="lead">${LEAD_OPTIONS.map(o => `<option value="${o.v}" ${cur.lead === o.v ? 'selected' : ''}>${o.t}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field-row">
        <div class="field"><label>Phone (optional)</label><input type="tel" name="phone" value="${esc(cur.phone || '')}" placeholder="04xx xxx xxx"></div>
        <div class="field"><label>Status</label>
          <select name="status">
            <option value="todo" ${cur.status === 'todo' ? 'selected' : ''}>To book</option>
            <option value="booked" ${cur.status === 'booked' ? 'selected' : ''}>Booked</option>
          </select>
        </div>
      </div>
      <div class="field"><label>Note</label><textarea name="note" placeholder="Confirmation number, check-in details…">${esc(cur.note || '')}</textarea></div>
      <div class="modal__err" id="merr"></div>
      <div class="modal__foot">
        ${b ? `<button type="button" class="btn btn--sm btn--ghost" style="color:var(--terra)" data-act="del-booking" data-id="${b.id}">Delete</button>` : ''}
        <span class="spacer"></span>
        <button type="button" class="btn btn--sm btn--ghost" data-act="close-modal">Cancel</button>
        <button type="submit" class="btn btn--sm btn--primary">${b ? 'Save' : 'Add booking'}</button>
      </div>
    </form>`;
  backdrop.classList.add('is-open');
  bindForm();
  setTimeout(() => modal.querySelector('input[name=title]')?.focus(), 60);
}

function bindForm(){
  const form = modal.querySelector('#mform');
  form.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(form);
    const data = {
      t: fd.get('t') || fd.get('time'),
      time: fd.get('time') || fd.get('t'),
      day: fd.get('day'),
      title: (fd.get('title') || '').trim(),
      note: (fd.get('note') || '').trim(),
      tag: fd.get('tag'),
      type: fd.get('type'),
      lead: Number(fd.get('lead')) || 60,
      phone: (fd.get('phone') || '').trim(),
      status: fd.get('status') || 'todo'
    };
    const err = modalSubmit ? modalSubmit(data) : null;
    if(err){
      const el = modal.querySelector('#merr');
      el.textContent = err; el.classList.add('show');
      return;
    }
    closeModal();
    render();
  });
}

/* =========================================================
   ACTIONS
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'goto'){ activeView = el.dataset.view; showBookings = false; render(); window.scrollTo({top:0, behavior:'smooth'}); }
  else if(act === 'tab'){
    const t = el.dataset.tab;
    if(t === 'bookings'){ showBookings = true; }
    else if(t === 'trip'){ showBookings = false; activeView = 'overview'; }
    else { showBookings = false; if(activeView === 'overview') activeView = lastDay; }
    render(); window.scrollTo({top:0});
  }
  else if(act === 'add-item'){ openItemModal(el.dataset.day || (activeView === 'overview' ? state.days[0].id : activeView)); }
  else if(act === 'edit-item'){ openItemModal(el.dataset.day, Number(el.dataset.idx)); }
  else if(act === 'del-item'){
    const d = dayById(el.dataset.day);
    if(d){ d.items.splice(Number(el.dataset.idx), 1); closeModal(); render(); }
  }
  else if(act === 'toggle-item'){
    const d = dayById(el.dataset.day);
    if(d){ const it = d.items[Number(el.dataset.idx)]; it.done = !it.done; render(); }
  }
  else if(act === 'add-booking'){ openBookingModal({day: el.dataset.day || (activeView === 'overview' ? null : activeView)}); }
  else if(act === 'edit-booking'){ openBookingModal({bookingId: el.dataset.id}); }
  else if(act === 'del-booking'){
    state.bookings = state.bookings.filter(b => b.id !== el.dataset.id);
    closeModal(); render();
  }
  else if(act === 'toggle-booking'){
    const b = state.bookings.find(x => x.id === el.dataset.id);
    if(b){ b.status = b.status === 'booked' ? 'todo' : 'booked'; render(); }
  }
  else if(act === 'close-modal'){ closeModal(); }
  else if(act === 'reset'){
    if(confirm('Reset the plan to the original itinerary and bookings? Anything you added will be removed.')){
      state = structuredClone(DEFAULTS); activeView = 'd1'; render();
    }
  }
  else if(act === 'export-json'){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    download(blob, 'south-australia-plan.json');
  }
  else if(act === 'export-ics'){
    download(new Blob([buildICS()], {type:'text/calendar'}), 'south-australia-trip.ics');
  }
});

function download(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- calendar export ---------- */
function buildICS(){
  const pad = n => String(n).padStart(2,'0');
  const stamp = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00';
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//SA Family Trip//Planner//EN','CALSCALE:GREGORIAN'
  ];
  state.bookings.forEach(b => {
    const d = dayById(b.day);
    if(!d || !b.time) return;
    const start = new Date(d.date + 'T' + b.time + ':00');
    const end = new Date(start.getTime() + 60*60*1000);
    lines.push('BEGIN:VEVENT');
    lines.push('UID:' + b.id + '@sa-family-trip');
    lines.push('DTSTAMP:' + stamp(new Date()));
    lines.push('DTSTART:' + stamp(start));
    lines.push('DTEND:' + stamp(end));
    lines.push('SUMMARY:' + (b.title || 'Booking').replace(/[,;]/g, ' '));
    if(b.note) lines.push('DESCRIPTION:' + b.note.replace(/[,;]/g, ' '));
    lines.push('BEGIN:VALARM','TRIGGER:-PT' + (b.lead || 60) + 'M','ACTION:DISPLAY','DESCRIPTION:' + (b.title || 'Booking').replace(/[,;]/g,' '),'END:VALARM');
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}

/* =========================================================
   BOOT
   ========================================================= */
const todayTripDay = tripDayForToday();
activeView = todayTripDay ? todayTripDay.id : 'd1';
lastDay = activeView;
render();
</script>
